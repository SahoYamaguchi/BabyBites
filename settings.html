<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BabyBites - 設定</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">BabyBites</p>
        <h1>設定</h1>
      </div>
      <nav class="nav-links" aria-label="画面切り替え">
        <a href="index.html">入力</a>
        <a href="history.html">履歴</a>
        <a href="foods.html">図鑑</a>
        <a href="insta.html">投稿</a>
        <a href="nutrition.html">栄養素</a>
        <a href="recipe.html">レシピ</a>
        <a aria-current="page" href="settings.html">設定</a>
      </nav>
    </header>

    <main class="container">
      <section class="card" aria-labelledby="settings-heading">
        <div class="section-title-row">
          <h2 id="settings-heading">基本設定</h2>
        </div>

        <div class="settings-fields">
          <label class="field-group" for="birth-date-input">
            <span class="field-label">生年月日</span>
            <input id="birth-date-input" type="date" />
          </label>
        </div>

        <div class="settings-fields">
          <label class="field-group" for="start-date-input">
            <span class="field-label">補完食 開始日</span>
            <input id="start-date-input" type="date" />
          </label>
        </div>

        <div class="settings-fields">
          <label class="field-group" for="absorption-rate-input">
            <span class="field-label">鉄の吸収率(%)</span>
            <input id="absorption-rate-input" type="number" min="1" max="100" step="1" />
          </label>
        </div>

        <button class="primary-button" id="save-settings-button" type="button">保存</button>
        <p class="status-message" id="settings-status" role="status" aria-live="polite"></p>
      </section>
    </main>

    <script type="module" src="js/settings.js"></script>
  </body>
</html>
